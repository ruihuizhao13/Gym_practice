<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Gym</title>
<meta name="description" content="Practice Gym: rehearse a hard feedback conversation with an AI employee and get coached on it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Practice Gym design system tokens */
:root { --surface: #f6f2ea; --surface-raised: #fffdf8; --surface-sunk: #ece6da; --ink: #1d2b2a; --ink-muted: #56625f; --line: #d9d1c2; --line-strong: #78827b; --teal: #1f5c58; --teal-soft: #dcebe7; --on-teal: #ffffff; --amber: #e9a23b; --on-amber: #2b1b04; --amber-soft: #f8e7c9; --amber-ink: #8a4a05; --shadow-card: 0 1px 2px rgba(29,43,42,0.06), 0 4px 16px rgba(29,43,42,0.06); --focus-ring: 0 0 0 2px #f6f2ea, 0 0 0 4px #1f5c58; --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px; --radius-pill: 999px; --font-serif: Fraunces, Georgia, "Times New Roman", serif; --font-sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface: #141b1b; --surface-raised: #1c2525; --surface-sunk: #0e1414; --ink: #ede8de; --ink-muted: #a9b2ae; --line: #2e3b3a; --line-strong: #6c7a77; --teal: #74c4b8; --teal-soft: #1d3633; --on-teal: #0b2220; --amber: #f0b45a; --on-amber: #2b1b04; --amber-soft: #3a2c15; --amber-ink: #f0b45a; --shadow-card: 0 1px 2px rgba(0,0,0,0.4); --focus-ring: 0 0 0 2px #141b1b, 0 0 0 4px #74c4b8; color-scheme: dark; } }
:root[data-theme="dark"] { --surface: #141b1b; --surface-raised: #1c2525; --surface-sunk: #0e1414; --ink: #ede8de; --ink-muted: #a9b2ae; --line: #2e3b3a; --line-strong: #6c7a77; --teal: #74c4b8; --teal-soft: #1d3633; --on-teal: #0b2220; --amber: #f0b45a; --on-amber: #2b1b04; --amber-soft: #3a2c15; --amber-ink: #f0b45a; --shadow-card: 0 1px 2px rgba(0,0,0,0.4); --focus-ring: 0 0 0 2px #141b1b, 0 0 0 4px #74c4b8; color-scheme: dark; }
html, body { margin: 0; background: var(--surface); color: var(--ink); }

body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 24px; background: var(--surface); color: var(--ink); }
.pg-pad { padding: var(--space-4); }
.pg-row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.pg-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.pg-muted { color: var(--ink-muted); }
.pg-label { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.pg-serif { font-family: var(--font-serif); font-weight: 560; }

/* Button */
.pg-btn { font: inherit; font-size: 16px; font-weight: 600; min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); }
.pg-btn-primary { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.pg-btn-accent { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.pg-btn-ghost { background: transparent; border-color: transparent; color: var(--teal); padding: 0 var(--space-2); }
.pg-btn-block { width: 100%; }
.pg-btn:disabled { opacity: .5; cursor: default; }
.pg-btn:focus-visible, .pg-opt:focus-visible, .pg-tab:focus-visible, .pg-choice:focus-visible, .pg-action:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }

/* Badge */
.pg-badge { display: inline-flex; align-items: center; gap: var(--space-1); font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px var(--space-2); border-radius: var(--radius-sm); background: var(--surface-sunk); color: var(--ink-muted); }
.pg-badge-teal { background: var(--teal-soft); color: var(--teal); }
.pg-badge-amber { background: var(--amber-soft); color: var(--amber-ink); }

/* Card */
.pg-card { background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-card); }

/* TabBar */
.pg-tabbar { display: flex; justify-content: space-around; background: var(--surface-raised); border-top: 1px solid var(--line); padding: var(--space-2) var(--space-1); }
.pg-tab { font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; background: none; border: 0; color: var(--ink-muted); display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); border-radius: var(--radius-md); cursor: pointer; }
.pg-tab-dot { width: 24px; height: 4px; border-radius: var(--radius-pill); background: transparent; }
.pg-tab[aria-current="page"] { color: var(--teal); }
.pg-tab[aria-current="page"] .pg-tab-dot { background: var(--teal); }

/* EntryAction (home) */
.pg-action { font: inherit; text-align: left; width: 100%; display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-4); border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink); cursor: pointer; }
.pg-action-now { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.pg-action-title { font-size: 19px; line-height: 26px; font-weight: 600; }
.pg-action-sub { font-size: 14px; line-height: 20px; }
.pg-action:not(.pg-action-now) .pg-action-sub { color: var(--ink-muted); }

/* LessonCard */
.pg-lesson { display: flex; flex-direction: column; gap: var(--space-2); }
.pg-lesson h3 { margin: 0; font-size: 19px; line-height: 26px; font-weight: 600; }
.pg-progress { height: 6px; border-radius: var(--radius-pill); background: var(--surface-sunk); overflow: hidden; }
.pg-progress > span { display: block; height: 100%; background: var(--teal); }

/* SBIFrame */
.pg-sbi { display: flex; flex-direction: column; gap: var(--space-2); }
.pg-sbi-step { display: grid; grid-template-columns: 32px 1fr; gap: var(--space-3); align-items: start; padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-raised); border: 1px solid var(--line); }
.pg-sbi-key { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--teal); color: var(--on-teal); font-family: var(--font-serif); font-weight: 600; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.pg-sbi-step.pg-sbi-extra .pg-sbi-key { background: var(--teal-soft); color: var(--teal); }
.pg-sbi-name { font-size: 14px; line-height: 20px; font-weight: 700; }
.pg-sbi-text { font-size: 16px; line-height: 24px; }

/* ExampleCompare */
.pg-compare { display: grid; gap: var(--space-3); }
.pg-ex { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
.pg-ex-weak { background: var(--amber-soft); }
.pg-ex-strong { background: var(--teal-soft); }
.pg-ex-weak .pg-label { color: var(--amber-ink); }
.pg-ex-strong .pg-label { color: var(--teal); }
.pg-ex q { display: block; margin: var(--space-1) 0; font-family: var(--font-serif); font-size: 18px; line-height: 26px; quotes: "\201C" "\201D"; }
.pg-ex p { margin: 0; font-size: 14px; line-height: 20px; }

/* KnowledgeCheck */
.pg-check { display: flex; flex-direction: column; gap: var(--space-3); }
.pg-check-q { margin: 0; font-size: 19px; line-height: 26px; font-weight: 600; }
.pg-opt { font: inherit; text-align: left; padding: var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); cursor: pointer; display: flex; gap: var(--space-3); align-items: flex-start; }
.pg-opt[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-soft); }
.pg-opt-mark { flex: none; width: 20px; height: 20px; border-radius: var(--radius-pill); border: 2px solid var(--line-strong); margin-top: 2px; }
.pg-opt[aria-pressed="true"] .pg-opt-mark { border-color: var(--teal); background: var(--teal); box-shadow: inset 0 0 0 3px var(--teal-soft); }
.pg-verdict { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: 14px; line-height: 20px; }
.pg-verdict-ok { background: var(--teal-soft); }
.pg-verdict-no { background: var(--amber-soft); }

/* ScenarioCard */
.pg-scn { display: flex; flex-direction: column; gap: var(--space-2); }
.pg-scn h3 { margin: 0; font-family: var(--font-serif); font-weight: 560; font-size: 22px; line-height: 28px; }
.pg-diff { display: inline-flex; gap: 3px; vertical-align: middle; }
.pg-diff i { width: 8px; height: 14px; border-radius: 2px; background: var(--surface-sunk); border: 1px solid var(--line-strong); }
.pg-diff i.on { background: var(--amber); border-color: var(--amber); }

/* PersonaHeader */
.pg-persona { display: flex; gap: var(--space-3); align-items: center; }
.pg-avatar { flex: none; width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--surface-sunk); color: var(--ink); font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid var(--line-strong); }
.pg-persona-main { flex: 1; min-width: 0; }
.pg-persona-name { font-weight: 600; }
.pg-meter { display: flex; gap: var(--space-1); margin-top: var(--space-1); }
.pg-meter i { flex: 1; height: 6px; border-radius: var(--radius-sm); background: var(--surface-sunk); border: 1px solid var(--line); }
.pg-meter i.on { background: var(--teal); border-color: var(--teal); }
.pg-meter.low i.on { background: var(--amber); border-color: var(--amber); }

/* ChatBubble */
.pg-chat { display: flex; flex-direction: column; gap: var(--space-2); }
.pg-msg { max-width: 84%; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: 16px; line-height: 24px; }
.pg-msg-manager { align-self: flex-end; background: var(--teal); color: var(--on-teal); border-bottom-right-radius: var(--radius-sm); }
.pg-msg-persona { align-self: flex-start; background: var(--surface-sunk); color: var(--ink); border-bottom-left-radius: var(--radius-sm); }
.pg-msg-coach { align-self: stretch; max-width: none; background: var(--teal-soft); color: var(--ink); font-size: 14px; line-height: 20px; }
.pg-msg-note { display: block; font-size: 14px; line-height: 20px; font-style: italic; color: var(--ink-muted); margin-top: 2px; }
.pg-msg-who { display: block; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); margin-bottom: 2px; }

/* ReplyChoices */
.pg-choices { display: flex; flex-direction: column; gap: var(--space-2); }
.pg-choice { font: inherit; text-align: left; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); cursor: pointer; font-size: 15px; line-height: 22px; }

/* HintCard */
.pg-hint { background: var(--amber-soft); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: 14px; line-height: 20px; }
.pg-hint .pg-label { color: var(--amber-ink); display: block; margin-bottom: 2px; }

/* RubricScore */
.pg-rubric { display: flex; flex-direction: column; gap: var(--space-2); }
.pg-rub-row { display: grid; grid-template-columns: 1fr auto; gap: var(--space-1) var(--space-3); align-items: center; padding: var(--space-2) 0; border-bottom: 1px solid var(--line); }
.pg-rub-row:last-child { border-bottom: 0; }
.pg-rub-name { font-weight: 600; font-size: 15px; }
.pg-rub-pips { display: inline-flex; gap: 3px; align-items: center; }
.pg-rub-pips i { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-sunk); border: 1px solid var(--line-strong); }
.pg-rub-pips i.on { background: var(--teal); border-color: var(--teal); }
.pg-rub-score { font-size: 14px; font-weight: 700; min-width: 2.2em; text-align: right; }
.pg-rub-ev { grid-column: 1 / -1; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.pg-rub-focus .pg-rub-name::after { content: " · focus"; color: var(--amber-ink); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

/* CoachFeedback */
.pg-coach { display: flex; flex-direction: column; gap: var(--space-3); }
.pg-coach-box { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
.pg-coach-strength { background: var(--teal-soft); }
.pg-coach-strength .pg-label { color: var(--teal); }
.pg-coach-next { background: var(--amber-soft); }
.pg-coach-next .pg-label { color: var(--amber-ink); }
.pg-coach-box p { margin: var(--space-1) 0 0; }
.pg-coach-rewrite { margin-top: var(--space-2); font-family: var(--font-serif); font-size: 17px; line-height: 25px; }

/* Phone frame used by the flow prototypes */
.pg-phone { width: 380px; max-width: 100%; height: 720px; margin: 0 auto; border-radius: 28px; border: 1px solid var(--line-strong); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-card); }
.pg-phone-top { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); background: var(--surface-raised); min-height: 28px; }
.pg-phone-top b { flex: 1; font-size: 15px; }
.pg-phone-body { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
.pg-phone-foot { padding: var(--space-3) var(--space-4); border-top: 1px solid var(--line); background: var(--surface-raised); display: flex; flex-direction: column; gap: var(--space-2); }
.pg-textarea { font: inherit; width: 100%; box-sizing: border-box; min-height: 104px; padding: var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); resize: vertical; }
.pg-textarea:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.pg-chip { font: inherit; font-size: 14px; padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); }
.pg-chip[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--teal); font-weight: 600; }
.pg-steps { display: flex; gap: var(--space-1); }
.pg-steps i { flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--surface-sunk); }
.pg-steps i.on { background: var(--teal); }
.pg-h1 { margin: 0; font-family: var(--font-serif); font-weight: 560; font-size: 26px; line-height: 32px; }
.pg-h2 { margin: 0; font-size: 19px; line-height: 26px; font-weight: 600; }
.pg-p { margin: 0; }
.pg-caption { text-align: center; font-size: 14px; line-height: 20px; color: var(--ink-muted); margin: var(--space-3) auto 0; max-width: 520px; }
.pg-caption b { color: var(--ink); }

/* Layout: one working column (max 980px) with a sticky step bar; coach step splits into feedback + ask-the-coach at wide widths. */
html, body { background: var(--surface); color: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface-raised); }
.lp-app { min-height: 100%; }
.lp-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface-raised); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
.lp-brand { display: flex; align-items: center; gap: 10px; }
.lp-name { font-size: 22px; line-height: 28px; }
.lp-steps { display: flex; gap: 4px; flex-wrap: wrap; }
.lp-step { font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-pill); border: 1px solid transparent; background: transparent; color: var(--ink-muted); cursor: pointer; }
.lp-step:disabled { opacity: .45; cursor: default; }
.lp-step[aria-current="step"] { background: var(--teal-soft); color: var(--teal); border-color: var(--teal); }
.lp-step-n { width: 20px; height: 20px; border-radius: var(--radius-pill); border: 1px solid currentColor; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.lp-step:focus-visible, .lp-scn:focus-visible, .lp-seg button:focus-visible, .pg-chip:focus-visible, .lp-input:focus-visible, .lp-check input:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.lp-main { max-width: 980px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.lp-stack { display: flex; flex-direction: column; gap: 16px; }
.lp-min0 { min-width: 0; }
.lp-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.lp-row-between { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.lp-spacer { flex: 1; }
.lp-small { font-size: 14px; line-height: 20px; }
.lp-grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.lp-field { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 14px; }
.lp-input { font: inherit; font-weight: 400; font-size: 16px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); min-width: 0; }
.lp-check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px; cursor: pointer; }
.lp-check input { margin-top: 3px; accent-color: var(--teal); width: 16px; height: 16px; flex: none; }
.lp-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.lp-scn { font: inherit; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); cursor: pointer; }
.lp-scn[aria-pressed="true"] { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); background: var(--teal-soft); }
.lp-scn-title { font-family: var(--font-serif); font-weight: 560; font-size: 20px; line-height: 26px; text-wrap: balance; }
.lp-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); overflow: hidden; }
.lp-seg button { font: inherit; font-size: 14px; border: 0; background: var(--surface-raised); color: var(--ink); padding: 6px 14px; cursor: pointer; }
.lp-seg button[aria-pressed="true"] { background: var(--teal); color: var(--on-teal); font-weight: 700; }
.lp-goals { display: flex; flex-wrap: wrap; gap: 8px; }
.lp-goal { font-size: 14px; padding: 4px 12px; border-radius: var(--radius-pill); background: var(--surface-sunk); color: var(--ink); }
.lp-goal.is-focus { background: var(--amber-soft); color: var(--amber-ink); font-weight: 700; }
.lp-chatbox { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-raised); box-shadow: var(--shadow-card); overflow: hidden; display: flex; flex-direction: column; }
.lp-chathead { padding: 12px 16px; border-bottom: 1px solid var(--line); }
.lp-chatlog { padding: 16px; max-height: 520px; min-height: 220px; overflow-y: auto; background: var(--surface); }
.lp-compose { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.lp-msg { min-height: 72px; }
.lp-draftchip { align-self: flex-start; cursor: pointer; }
.pg-chip { cursor: pointer; text-align: left; }
.pg-chip:disabled { opacity: .5; cursor: default; }
.lp-trace { font-size: 12.5px; line-height: 18px; color: var(--ink-muted); align-self: flex-start; }
.lp-thinking { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-muted); padding: 6px 0; }
.lp-dots { display: inline-flex; gap: 4px; }
.lp-dots i { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--teal); animation: lp-b 1.2s infinite ease-in-out; }
.lp-dots i:nth-child(2) { animation-delay: .15s; } .lp-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes lp-b { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .lp-dots i { animation: none; opacity: .7; } }
.lp-err { background: var(--amber-soft); color: var(--ink); border-radius: var(--radius-md); padding: 10px 14px; font-size: 14px; line-height: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lp-coachgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .lp-coachgrid { grid-template-columns: 1fr; } }
.lp-askcoach { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); }
@media (max-width: 820px) { .lp-askcoach { position: static; } }
.lp-coachlog { max-height: 460px; overflow-y: auto; }

<script>
/* Practice Gym · AI connector for the GitHub Pages version.
   On claude.ai the prototype asks Claude through the artifact runtime (window.claude.use('sample')).
   Here the same interface is rebuilt on the Claude API, using a key the facilitator provides.
   The key stays in this browser (localStorage) and is sent only to api.anthropic.com. */
(function () {
  var KEY = 'pg_api_key', MODEL = 'pg_model';
  var DEFAULT_MODEL = 'claude-sonnet-5-5', QUICK_MODEL = 'claude-haiku-5-5';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }

  // A testing link can carry the key: https://<you>.github.io/practice-gym/#key=sk-ant-...
  try {
    var m = location.hash.match(/key=([^&]+)/);
    if (m) { put(KEY, decodeURIComponent(m[1]).trim()); history.replaceState(null, '', location.pathname + location.search); }
  } catch (e) {}

  function toMessages(input) {
    if (typeof input === 'string') return [{ role: 'user', content: input }];
    var out = [];
    input.forEach(function (t) {
      var r = t.role === 'assistant' ? 'assistant' : 'user';
      var last = out[out.length - 1];
      if (last && last.role === r) last.content += '\n\n' + t.content; else out.push({ role: r, content: String(t.content) });
    });
    if (out.length && out[0].role !== 'user') out.unshift({ role: 'user', content: '(The conversation begins.)' });
    if (out.length && out[out.length - 1].role === 'assistant') out[out.length - 1].content = out[out.length - 1].content.replace(/\s+$/, '');
    return out;
  }
  function fail(code, text) { return { code: code, text: text || '' }; }

  function request(input, opts) {
    opts = opts || {};
    var key = get(KEY);
    if (!key) return Promise.reject(fail('not_granted'));
    var model = opts.modelTier === 'quick' ? QUICK_MODEL : (get(MODEL) || DEFAULT_MODEL);
    var stream = typeof opts.onText === 'function';
    var sofar = '';
    return fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: opts.signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: model, max_tokens: 4096, messages: toMessages(input), stream: stream })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          if (res.status === 401 || res.status === 403) throw fail('bad_key', t);
          if (res.status === 429 || res.status === 529) throw fail('rate_limited', t);
          if (res.status === 404 || /model/i.test(t)) throw fail('bad_model', t);
          throw fail('api_error', t);

      if (!stream) return res.json().then(function (j) { return (j.content || []).map(function (c) { return c.text || ''; }).join(''); });

        return reader.read().then(function (r) {
          if (r.done) return sofar;
          buf += dec.decode(r.value, { stream: true });
          var parts = buf.split('\n\n'); buf = parts.pop();

            ev.split('\n').forEach(function (line) {
              if (line.indexOf('data:') !== 0) return;
              try {
                var d = JSON.parse(line.slice(5));
                if (d.type === 'content_block_delta' && d.delta && d.delta.text) { sofar += d.delta.text; opts.onText({ text: sofar, delta: d.delta.text }); }
                if (d.type === 'error') throw fail('api_error', JSON.stringify(d.error));
              } catch (e) { if (e && e.code) throw e; }
            });
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (e) {
      if (e && e.name === 'AbortError') throw fail('cancelled', sofar);
      if (e && e.code) throw e;
      throw fail('network', (e && e.message) || '');

  function parseJson(text) {
    var t = text.replace(/```(?:json)?/g, '').trim();
    var a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
    if (a < 0 || b < a) throw fail('invalid_json', text);
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw fail('invalid_json', text); }
  }

  var sample = function (input, opts) { return request(input, opts).then(function (t) { return { text: t, truncated: false }; }); };
  sample.json = function (input, opts) {
    var o = Object.assign({}, opts || {}); delete o.onText;
    return request(input, o).then(parseJson);
  };

  window.claude = { use: function (name) { return Promise.resolve(name === 'sample' && get(KEY) ? sample : null); } };

  // ---------- small "AI settings" panel (for the facilitator) ----------
  function panel() {
    var on = !!get(KEY);
    var wrap = document.createElement('div');
    wrap.className = 'pgc';
    wrap.innerHTML =
      '<button type="button" class="pgc-toggle" aria-expanded="false"><span class="pgc-dot ' + (on ? 'on' : '') + '"></span>' + (on ? 'AI connected' : 'AI not connected') + '</button>' +
      '<div class="pgc-box" hidden>' +
      '<p class="pgc-title">AI settings (for the facilitator)</p>' +
      '<label class="pgc-lbl">Claude API key<input class="pgc-in" id="pgc-key" type="password" autocomplete="off" placeholder="sk-ant-..."></label>' +
      '<label class="pgc-lbl">Model<input class="pgc-in" id="pgc-model" type="text" placeholder="' + DEFAULT_MODEL + '"></label>' +
      '<p class="pgc-note">The key is saved only in this browser and sent only to api.anthropic.com.</p>' +
      '<div class="pgc-row"><button type="button" class="pgc-btn" id="pgc-save">Save and reload</button><button type="button" class="pgc-btn ghost" id="pgc-clear">Disconnect</button></div>' +
      '</div>';
    document.body.appendChild(wrap);
    var tog = wrap.querySelector('.pgc-toggle'), box = wrap.querySelector('.pgc-box');
    wrap.querySelector('#pgc-model').value = get(MODEL) || '';
    tog.addEventListener('click', function () { box.hidden = !box.hidden; tog.setAttribute('aria-expanded', String(!box.hidden)); });
    wrap.querySelector('#pgc-save').addEventListener('click', function () {
      var k = wrap.querySelector('#pgc-key').value.trim(), md = wrap.querySelector('#pgc-model').value.trim();
      if (k) put(KEY, k); put(MODEL, md); location.reload();
    });
    wrap.querySelector('#pgc-clear').addEventListener('click', function () { put(KEY, null); location.reload(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', panel); else panel();
})();

</script>
